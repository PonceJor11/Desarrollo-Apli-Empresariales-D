{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Citas Médicas</h2>
    <a href="{% url 'veterinary:create' %}" class="btn btn-primary">Registrar Nueva Cita</a>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Mascota</th>
            <th>Especie</th>
            <th>Dueño</th>
            <th>Motivo</th>
            <th>Fecha</th>
        </tr>
    </thead>
    <tbody>
        {% for appt in appointments %}
        <tr>
            <td>{{ appt.id }}</td>
            <td>{{ appt.pet_name }}</td>
            <td>{{ appt.species }}</td>
            <td>{{ appt.owner_name }}</td>
            <td>{{ appt.reason }}</td>
            <td>{{ appt.date }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
